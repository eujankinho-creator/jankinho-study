<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laboratório da Célula | Cortex</title>

  <script>
    (function () {
      var theme = "dark-orange";
      try {
        var saved = localStorage.getItem("jankinho_theme_v1");
        if (saved) theme = saved;
      } catch (error) {}
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>

  <link rel="stylesheet" href="/css/app.css?v=20261002-fluid-final4">
  <link rel="stylesheet" href="/css/ui-enhancements.css?v=20261002-fluid-final4">
  <link rel="stylesheet" href="/css/themes.css?v=20261002-fluid-final4">
  <link rel="stylesheet" href="/css/cortex-brand.css?v=20261002-fluid-final4">
  <link rel="stylesheet" href="/css/sidebar-standard.css?v=20261002-lab-new1">
  <link rel="stylesheet" href="/css/theme-final.css?v=20261002-fluid-final4">
  <link rel="stylesheet" href="/css/laboratorio-celula.css?v=20261003-reset1">

  <script defer src="/js/ui-enhancements.js?v=20261001-nav-core8"></script>
  <script defer src="/js/theme-manager.js?v=20261001-nav-core8"></script>
  <script defer src="/js/sidebar-standard.js?v=20261003-lab1"></script>

  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=cortex-white-v3">
  <meta name="theme-color" content="#07090d">
</head>

<body class="practice-view lab-view cell-lab-reset-view">
  <aside class="sidebar">
    <a href="/" class="sidebar-logo">
      <div class="logo-box">C</div>
      <div><strong>Cortex</strong><span>Study Platform</span></div>
    </a>

    <div class="sidebar-menu"></div>

    <div class="sidebar-user">
      <div id="avatarSidebar" class="avatar">U</div>
      <div class="user-info">
        <strong id="nomeSidebar">Carregando...</strong>
        <span id="emailSidebar"></span>
      </div>
      <button id="logoutSidebar" class="logout-button" type="button" title="Sair" aria-label="Sair">&#8618;</button>
    </div>
  </aside>

  <div class="main-area">
    <header class="header">
      <div>
        <div class="header-title">Laboratório da Célula</div>
        <span class="cell-reset-subtitle">Nova construção</span>
      </div>

      <div class="header-user">
        <div>
          <strong id="nomeHeader">Carregando...</strong>
          <span>Cortex</span>
        </div>
        <div id="avatarHeader" class="avatar header-avatar">U</div>
      </div>
    </header>

    <main class="cell-reset-page">
      <a class="back-lab-link" href="/laboratorio.html">← Voltar ao hub</a>

      <section class="cell-reset-empty" aria-label="Área vazia do novo laboratório da célula">
        <span>BASE LIMPA</span>
        <h1>Laboratório da Célula</h1>
        <p>O simulador anterior foi removido. Esta área está pronta para ser construída do zero.</p>
      </section>
    </main>
  </div>

  <script>
    (function () {
      async function loadUser() {
        try {
          var response = await fetch("/api/auth/me", { credentials: "same-origin" });
          if (response.status === 401) {
            location.href = "/login.html";
            return;
          }
          if (!response.ok) return;

          var data = await response.json();
          var user = data.usuario || {};
          var name = user.nome || "Usuário";
          var initial = name.charAt(0).toUpperCase();

          document.getElementById("nomeSidebar").textContent = name;
          document.getElementById("emailSidebar").textContent = user.email || "";
          document.getElementById("nomeHeader").textContent = name;
          document.getElementById("avatarSidebar").textContent = initial;
          document.getElementById("avatarHeader").textContent = initial;
        } catch (error) {}
      }

      document.getElementById("logoutSidebar").addEventListener("click", async function () {
        try {
          await fetch("/api/auth/logout", { method: "POST", credentials: "same-origin" });
        } finally {
          location.href = "/login.html";
        }
      });

      loadUser();
    })();
  </script>
  <script src="/js/cortex-brand.js?v=20260930-global4"></script>
</body>
</html>
