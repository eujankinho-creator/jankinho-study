<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
>
  <defs>

    <linearGradient
      id="bg"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0%"
        stop-color="#0b223b"
      />

      <stop
        offset="100%"
        stop-color="#02070d"
      />
    </linearGradient>


    <linearGradient
      id="brain"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0%"
        stop-color="#72c1ff"
      />

      <stop
        offset="100%"
        stop-color="#1687ff"
      />
    </linearGradient>


    <filter id="blueGlow">

      <feGaussianBlur
        stdDeviation="1.15"
        result="blur"
      />

      <feMerge>

        <feMergeNode
          in="blur"
        />

        <feMergeNode
          in="SourceGraphic"
        />

      </feMerge>

    </filter>

  </defs>


  <rect
    x="2"
    y="2"
    width="60"
    height="60"
    rx="16"
    fill="url(#bg)"
    stroke="#1687ff"
    stroke-opacity=".32"
    stroke-width="2"
  />


  <circle
    cx="32"
    cy="32"
    r="24"
    fill="#1687ff"
    fill-opacity=".045"
  />


  <g
    transform="translate(8 8) scale(2)"
    fill="none"
    stroke="url(#brain)"
    stroke-width="1.65"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#blueGlow)"
  >

    <path
      d="M9.5 4.5A2.5 2.5 0 0 0 7 7v.2A2.8 2.8 0 0 0 5 12c-.6.5-1 1.3-1 2.2A2.8 2.8 0 0 0 7 17a2.5 2.5 0 0 0 5 0V7a2.5 2.5 0 0 0-2.5-2.5Z"
    />

    <path
      d="M14.5 4.5A2.5 2.5 0 0 1 17 7v.2a2.8 2.8 0 0 1 2 4.8c.6.5 1 1.3 1 2.2A2.8 2.8 0 0 1 17 17a2.5 2.5 0 0 1-5 0V7a2.5 2.5 0 0 1 2.5-2.5Z"
    />

    <path
      d="M8.5 9.3c1 .1 1.7.6 2 1.4"
    />

    <path
      d="M15.5 9.3c-1 .1-1.7.6-2 1.4"
    />

    <path
      d="M8.5 14c1-.1 1.7-.6 2-1.4"
    />

    <path
      d="M15.5 14c-1-.1-1.7-.6-2-1.4"
    />

  </g>

</svg>
