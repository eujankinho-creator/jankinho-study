<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Cortex</title>

  <script>
    (function () {
      var allowed = ["dark-orange","dark-pink","dark-green","dark-purple","dark-black"];
      var theme = "dark-purple";
      try {
        var saved = localStorage.getItem("jankinho_theme_v1");
        if (allowed.indexOf(saved) >= 0) theme = saved;
      } catch (error) {}
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>


  <link
    rel="stylesheet"
    href="/css/app.css?v=20261001-nav-core5"
  >

  <link
    rel="stylesheet"
    href="/css/app-shell.css?v=20261008-miniplayer-minimal1"
  >

  <link
    rel="stylesheet"
    href="/css/themes.css?v=20261002-fluid-final4"
  >

  <script defer src="/js/theme-manager.js?v=20261007-purple-default3"></script>

  <link rel="stylesheet" href="/css/theme-final.css?v=20261007-pet-global10">

  <link rel="stylesheet" href="/css/semantic-states.css?v=20261002-fluid-final4">
  <link
    rel="icon"
    type="image/svg+xml"
    href="/favicon.svg?v=cortex-minimal-v4"
  >

  <meta
    name="theme-color"
    content="#090909"
  >
  <link
    rel="stylesheet"
    href="/css/pink-pet.css?v=20261006-pet-theme1"
  >

</head>


<body class="cortex-app-shell">


  <main class="shell-workspace">

    <iframe
      id="cortexAppFrame"
      class="shell-frame shell-frame-active"
      title="Cortex"
      allow="autoplay; encrypted-media"
    ></iframe>

    <iframe
      id="cortexAppFrameNext"
      class="shell-frame shell-frame-standby"
      title="Cortex - carregamento"
      allow="autoplay; encrypted-media"
      aria-hidden="true"
      tabindex="-1"
    ></iframe>

  </main>


  <button
    id="globalPlayerBubble"
    class="global-player-bubble"
    type="button"
    aria-label="Abrir player"
    title="Abrir player"
  >
    &#9835;

    <span
      id="globalPlayerPlayingDot"
      class="global-player-playing-dot"
    ></span>

  </button>


  <footer
    id="globalMusicPlayer"
    class="global-music-player"
  >

    <button
      id="globalPlayerClose"
      class="global-player-close"
      type="button"
      aria-label="Recolher player"
      title="Recolher player"
    >
      &times;
    </button>


    <div class="global-track">

      <div class="global-cover-wrap">

        <img
          id="globalCover"
          class="global-cover hidden"
          alt="Capa do album"
        >

        <div
          id="globalCoverPlaceholder"
          class="global-cover-placeholder"
        >
          &#9835;
        </div>

      </div>


      <div class="global-track-copy">

        <strong id="globalTrackName">
          Cortex Player
        </strong>

        <span id="globalTrackArtist">
          Conecte o Spotify
        </span>

      </div>

    </div>


    <div class="global-center">

      <div class="global-controls">

        <button
          id="globalPrevious"
          type="button"
          aria-label="Musica anterior"
        >
          &#9198;
        </button>

        <button
          id="globalPlay"
          class="global-main-play"
          type="button"
          aria-label="Play"
        >
          &#9654;
        </button>

        <button
          id="globalNext"
          type="button"
          aria-label="Proxima musica"
        >
          &#9197;
        </button>

      </div>


      <div class="global-progress">

        <span id="globalCurrentTime">
          0:00
        </span>

        <input
          id="globalProgress"
          type="range"
          min="0"
          max="1000"
          value="0"
        >

        <span id="globalDuration">
          0:00
        </span>

      </div>

    </div>


    <div class="global-right">


      <button
        id="openMusicPage"
        class="global-music-page"
        type="button"
      >
        &#9835;
        <span>M&uacute;sica</span>
      </button>


      <div class="global-volume">

        <span>
          &#128266;
        </span>

        <input
          id="globalVolume"
          type="range"
          min="0"
          max="100"
          value="55"
        >

        <small id="globalVolumeValue">
          55%
        </small>

      </div>


      <button
        id="globalSpotifyConnect"
        class="global-connect"
        type="button"
      >
        Conectar
      </button>

    </div>


  </footer>



  <section id="globalLessonPlayer" class="global-lesson-player hidden" aria-label="Videoaula ativa">
    <div class="global-lesson-head">
      <div class="global-lesson-copy">
        <span>AULA ATIVA</span>
        <strong id="globalLessonTitle">Videoaula</strong>
        <small id="globalLessonChannel">YouTube</small>
      </div>
      <div class="global-lesson-window-actions">
        <button id="globalLessonMinimize" type="button" title="Continuar navegando" aria-label="Minimizar aula">—</button>
        <button id="globalLessonExpand" type="button" title="Expandir aula" aria-label="Expandir aula">↗</button>
        <button id="globalLessonClose" type="button" title="Fechar aula" aria-label="Fechar aula">×</button>
      </div>
    </div>
    <div class="global-lesson-video" id="globalLessonVideoSurface">
      <div id="globalLessonYoutube"></div>
      <div id="globalLessonInteractionLayer" class="global-lesson-interaction-layer" aria-hidden="true"></div>
    </div>
    <div class="global-lesson-controls">
      <button id="globalLessonBack" type="button" aria-label="Voltar 10 segundos">−10</button>
      <button id="globalLessonPlay" class="global-lesson-main" type="button" aria-label="Play">▶</button>
      <button id="globalLessonForward" type="button" aria-label="Avançar 10 segundos">+10</button>
      <div class="global-lesson-progress-wrap">
        <span id="globalLessonCurrent">0:00</span>
        <input id="globalLessonProgress" type="range" min="0" max="1000" value="0" aria-label="Progresso da aula">
        <span id="globalLessonDuration">0:00</span>
      </div>
      <div class="global-lesson-volume">
        <span>🔊</span>
        <input id="globalLessonVolume" type="range" min="0" max="100" value="70" aria-label="Volume">
      </div>

      <div class="global-lesson-settings">
        <button
          id="globalLessonSettingsButton"
          class="global-lesson-settings-button"
          type="button"
          aria-label="Ajustes da videoaula"
          aria-expanded="false"
          title="Ajustes"
        >
          ⚙
        </button>

        <div
          id="globalLessonSettingsMenu"
          class="global-lesson-settings-menu"
          hidden
        >
          <label>
            <span>Qualidade</span>
            <select id="globalLessonQuality" aria-label="Qualidade do vídeo">
              <option value="default">Auto</option>
              <option value="hd1080">1080p</option>
              <option value="hd720">720p</option>
              <option value="large">480p</option>
              <option value="medium">360p</option>
              <option value="small">240p</option>
            </select>
          </label>

          <label>
            <span>Velocidade</span>
            <select id="globalLessonRate" aria-label="Velocidade de reprodução">
              <option value="0.5">0.5x</option>
              <option value="0.75">0.75x</option>
              <option value="1">1x</option>
              <option value="1.25">1.25x</option>
              <option value="1.5">1.5x</option>
              <option value="1.75">1.75x</option>
              <option value="2">2x</option>
            </select>
          </label>

          <div class="global-lesson-settings-note">
            O YouTube pode ajustar a qualidade automaticamente conforme rede e dispositivo.
          </div>
        </div>
      </div>
    </div>
    <div class="global-lesson-resize-zones" aria-hidden="true">
      <span data-lesson-resize="n"></span>
      <span data-lesson-resize="e"></span>
      <span data-lesson-resize="s"></span>
      <span data-lesson-resize="w"></span>
      <span data-lesson-resize="ne"></span>
      <span data-lesson-resize="se"></span>
      <span data-lesson-resize="sw"></span>
      <span data-lesson-resize="nw"></span>
    </div>
  </section>

  <script src="/js/app-shell.js?v=20261008-miniplayer-minimal1"></script>
  <script src="/js/pink-pet.js?v=20261007-pet-account1"></script>

</body>
</html>
