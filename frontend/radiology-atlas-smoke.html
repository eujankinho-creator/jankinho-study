<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Radiology atlas multiview smoke</title>
  <script type="importmap">
    {
      "imports": {
        "three": "/vendor/three/three.module.js?v=smoke",
        "three/addons/": "/vendor/three/addons/"
      }
    }
  </script>
  <style>
    body{margin:0;background:#06090d;color:#eaf3f8;font-family:monospace;padding:14px}
    pre{white-space:pre-wrap;word-break:break-word;border:1px solid #24313d;padding:12px;border-radius:10px;background:#0d1319}
    .grid{display:grid;grid-template-columns:1fr 1.3fr;gap:10px;height:620px}
    .stage{position:relative;min-width:0;min-height:0;border:1px solid #24313d}
    canvas{width:100%;height:100%;display:block}
    #mv{display:grid;grid-template-columns:1fr 28%;grid-template-rows:1fr 1fr;gap:6px;padding:6px;background:#000}
    [data-rad-view-plane]{position:relative;min-width:0;min-height:0;border:1px solid #27313c}
    [data-rad-view-plane].is-primary{grid-column:1;grid-row:1/3}
    [data-rad-view-plane].secondary-top{grid-column:2;grid-row:1}
    [data-rad-view-plane].secondary-bottom{grid-column:2;grid-row:2}
  </style>
</head>
<body>
  <h1>Radiology atlas + multiview smoke</h1>
  <pre id="status">boot</pre>
  <div class="grid">
    <div class="stage"><canvas id="atlas"></canvas></div>
    <div class="stage" id="mv">
      <section data-rad-view-plane="axial"><canvas id="ax"></canvas><span data-expand-label></span></section>
      <section data-rad-view-plane="coronal"><canvas id="co"></canvas><span data-expand-label></span></section>
      <section data-rad-view-plane="sagittal"><canvas id="sa"></canvas><span data-expand-label></span></section>
    </div>
  </div>
  <script type="module">
    import { AnatomyViewer } from "/js/radiologia/anatomy-viewer.js";
    import { RadiologyMultiView } from "/js/radiologia/radiology-multiview.js";
    const out=document.getElementById("status");
    const log=(v)=>{out.textContent += "\n"+v;};
    window.addEventListener("error",(e)=>log("window.error: "+(e.error?.stack||e.message)));
    window.addEventListener("unhandledrejection",(e)=>log("unhandled: "+(e.reason?.stack||e.reason)));
    try{
      const atlas=new AnatomyViewer(document.getElementById("atlas"),{});
      const mv=new RadiologyMultiView(
        document.getElementById("mv"),
        {axial:document.getElementById("ax"),coronal:document.getElementById("co"),sagittal:document.getElementById("sa")},
        {}
      );
      const [atlasReport]=await Promise.all([atlas.ready,mv.ready]);
      log("atlas systems="+JSON.stringify(atlasReport.systemsLoaded));
      log("atlas failures="+JSON.stringify(atlasReport.failures));
      log("atlas coverage="+JSON.stringify(atlasReport.structures.filter(x=>x.meshCount>0)));
      log("mpr dims="+JSON.stringify(mv.dims));
      log("mpr available="+JSON.stringify(mv.getAvailableStructureIds()));
      log("primary="+mv.primaryPlane);
      mv.setPrimaryPlane("coronal");
      await new Promise(r=>setTimeout(r,300));
      log("promoted="+mv.primaryPlane);
      log("coronal primary class="+document.querySelector('[data-rad-view-plane="coronal"]').classList.contains("is-primary"));
      out.dataset.ok="1";
    }catch(error){
      out.dataset.ok="0";
      log("ERROR: "+(error?.stack||error?.message||String(error)));
    }
  </script>
</body>
</html>
