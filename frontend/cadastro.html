<body>

  <main class="auth-page">

    <div class="glow glow-top"></div>

      </div>

            Primeiro acesso

              <label for="nome">

              <input

              >

            <div class="field">

              <input
                id="confirmarSenha"
                class="input"
                type="password"
                placeholder="Digite a senha novamente"
                autocomplete="new-password"
              >

            </div>


            <button
