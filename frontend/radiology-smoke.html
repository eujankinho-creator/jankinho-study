<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Radiology full runtime smoke</title>
  <style>
    body{margin:0;background:#090d12;color:#e7eef5;font-family:monospace;padding:20px}
    pre{white-space:pre-wrap;word-break:break-word;padding:14px;border:1px solid #27313c;border-radius:10px;background:#0e141b}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .stage{height:500px;border:1px solid #27313c}
    canvas{display:block;width:100%;height:100%}
  </style>
</head>
<body>
  <h1>Radiology full runtime smoke</h1>
  <pre id="status">boot</pre>
  <div class="grid">
    <div class="stage"><canvas id="exam3d"></canvas></div>
    <div class="stage"><canvas id="mpr"></canvas></div>
  </div>
  <script type="module">
    import { Exam3DViewer } from "/js/radiologia/exam-3d-viewer.js";
    import { RadiologyViewer } from "/js/radiologia/radiology-viewer.js";
    const status=document.getElementById("status");
    const log=(value)=>{status.textContent += "\n"+value;};
    window.addEventListener("error",(e)=>log("window.error: "+(e.error?.stack||e.message)));
    window.addEventListener("unhandledrejection",(e)=>log("unhandledrejection: "+(e.reason?.stack||e.reason)));
    try{
      log("construct");
      const exam3d=new Exam3DViewer(document.getElementById("exam3d"),{});
      const mpr=new RadiologyViewer(document.getElementById("mpr"),{});
      log("await ready");
      const [a,b]=await Promise.all([exam3d.ready,mpr.ready]);
      log("exam3d ready="+Boolean(a));
      log("mpr ready="+Boolean(b));
      log("mpr dims="+JSON.stringify(mpr.dims));
      log("available="+JSON.stringify(mpr.getAvailableStructureIds()));
      log("state="+JSON.stringify(mpr.getState()));
      status.dataset.ok="1";
    }catch(error){
      status.dataset.ok="0";
      log("ERROR: "+(error?.stack||error?.message||String(error)));
    }
  </script>
</body>
</html>
